<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nobre Maria Antonieta · Central de links</title>
<meta name="description" content="Todos os links do bazar Nobre Maria Antonieta em um só lugar.">
<meta property="og:title" content="Nobre Maria Antonieta · Central de links">
<meta property="og:description" content="Site, painel, planilha e guias do bazar em leilão.">
<meta property="og:image" content="https://carlaalbericefurutani-ops.github.io/bazar/logo.jpg">
<meta name="theme-color" content="#9c5a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbf6f1;--ink:#2b2120;--muted:#6a5d5a;--card:#fff;--line:#eadfd8;--rose:#9c5a4a;--rose-d:#7d4538;--rose-l:#f6e6e1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.4}
  main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
  .topo{text-align:center;margin-bottom:22px}
  .logo{width:min(62%,260px);height:auto;mix-blend-mode:multiply;display:block;margin:0 auto}
  h1{font-family:'Cinzel',Georgia,serif;font-weight:600;letter-spacing:.06em;font-size:1.7rem;margin:8px 0 4px;
     background:linear-gradient(90deg,#8a4b3c,#b07a66,#8a4b3c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .topo p{margin:0;color:var(--rose);font-style:italic;font-weight:700}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  a.link{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit;text-decoration:none;
         transition:transform .15s,box-shadow .15s,border-color .15s}
  a.link:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(125,69,56,.15);border-color:#d9b5a8}
  a.link:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
  .ic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--rose-l);display:grid;place-items:center}
  .ic svg{width:26px;height:26px;stroke:var(--rose-d);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tx{min-width:0;flex:1}
  .tx strong{display:block;font-size:1.05rem}
  .tx span{display:block;color:var(--muted);font-size:.9rem}
  .seta{flex:none;width:20px;height:20px;stroke:var(--rose);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tx span.lock{display:inline-block;color:var(--rose-d);font-size:.78rem;font-weight:700;background:var(--rose-l);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .nota{margin:20px 4px 0;color:var(--muted);font-size:.88rem;text-align:center}
  footer{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.84rem;text-align:center}
  @media (prefers-reduced-motion:reduce){a.link{transition:none}a.link:hover{transform:none}}
</style>
</head>
<body>
<main>
  <div class="topo">
    <img class="logo" src="logo.jpg" width="603" height="445" alt="Nobre Maria Antonieta">
    <h1>Central de links</h1>
    <p>Tudo do bazar em um só lugar</p>
  </div>

  <ul id="lista"></ul>
  <p class="nota">A senha do painel foi enviada separadamente.</p>
  <footer id="rodape"></footer>
</main>

<script>
(function(){
  'use strict';
  /* ======= edite aqui ======= */
  var NOME = 'Nobre Maria Antonieta';
  var LINKS = [
    { icone:'site',   titulo:'Site do bazar',          texto:'O que as clientes veem e onde dão os lances', url:'https://carlaalbericefurutani-ops.github.io/bazar/' },
    { icone:'painel', titulo:'Painel da organizadora', texto:'Acompanhe lances, líderes e arrematantes', url:'https://carlaalbericefurutani-ops.github.io/bazar/painel.html', senha:true },
    { icone:'planilha', titulo:'Planilha do bazar',    texto:'Peças, fotos, datas e relatórios', url:'https://docs.google.com/spreadsheets/d/1xA4VDckfztGqzsCIrm9yj97YZ8yFPoAFucbz4pHaWSI/edit' },
    { icone:'guia',   titulo:'Guia visual',            texto:'O passo a passo em uma página, só olhar', url:'https://claude.ai/artifact/UTKV3foSsRa8PUngRtEmJS' },
    { icone:'livro',  titulo:'Guia completo e testes', texto:'Instruções detalhadas e roteiro de testes', url:'https://claude.ai/artifact/4J3Sxj3gBWKLzgsTVDjhiL' }
  ];
  /* ========================== */
  var ICONES = {
    site:'<path d="M4 20V10l8-6 8 6v10z"/><path d="M10 20v-6h4v6"/>',
    painel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 16v-4M12 16V8M17 16v-6"/>',
    planilha:'<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 10h17M3.5 15h17M9.5 4v16"/>',
    guia:'<rect x="3" y="3.5" width="18" height="17" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="m4 17 5-4.5 3.5 3 3-2.5L20 16"/>',
    livro:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>'
  };
  var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  document.getElementById('lista').innerHTML = LINKS.map(function(l){
    return '<li><a class="link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      '<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONES[l.icone] + '</svg></span>' +
      '<span class="tx"><strong>' + esc(l.titulo) + (l.senha ? '<span class="lock">com senha</span>' : '') + '</strong><span>' + esc(l.texto) + '</span></span>' +
      '<svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></li>';
  }).join('');
  document.getElementById('rodape').textContent = '© ' + new Date().getFullYear() + ' ' + NOME + '. Todos os direitos reservados.';
})();
</script>
</body>
</html>
